name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifacts (Unix)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p staging
          cp target/release/Zeevum-server staging/
          tar -czf zeevum-server-linux-amd64.tar.gz -C staging .

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir staging
          copy target\release\Zeevum-server.exe staging\
          Compress-Archive -Path staging\* -DestinationPath zeevum-server-windows-x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            zeevum-server-linux-amd64.tar.gz
            zeevum-server-windows-x64.zip
            zeevum-server-installer-linux-amd64.sh
          prerelease: ${{ contains(github.ref_name, '-') }}