[package]
name = "Zeevum-server"
version = "0.3.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.24.0", features = ["v4"] }
anyhow = "1.0.104"
colored = "3.1.1"
dotenvy = "0.15.7"
argon2 = { version = "0.5.3", features = ["std"] }
password-hash = "0.6.1"
rand_core = "0.10.1"
ctrlc = "3.5.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["alloc"] }
zxcvbn = "3.1.1"
sha2 = "0.11.0"
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = "0.26.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "macros"] }